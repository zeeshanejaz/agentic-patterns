[project]
name = "sd-agentic-maf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sd-agentic-shared",
    "agent-framework-core>=1",
    "agent-framework-openai>=1",
    "agent-framework-orchestrations>=1",
    "opentelemetry-exporter-otlp-proto-http>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
sd-agentic-shared = { workspace = true }
